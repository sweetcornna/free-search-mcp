name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reuses ci.yml verbatim so the release gate and the PR gate are the same
  # definition — they can never silently diverge.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Validate release metadata
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got $TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          project_version="$(uv version --short)"
          if [[ "$project_version" != "$version" ]]; then
            echo "pyproject version $project_version != tag $version" >&2
            exit 1
          fi
          uv lock --check

          python3 - "$version" <<'PY'
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          prefix = f"## [{expected}] - "
          try:
              start = next(i for i, line in enumerate(lines) if line.startswith(prefix))
          except StopIteration:
              raise SystemExit(f"CHANGELOG has no {expected} release section") from None
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1 : end]).strip() + "\n"
          Path("release-notes.md").write_text(notes)
          PY

          # The Claude Code plugin republishes this same server, so its
          # manifest version and the package pin inside it are two more copies
          # of the number the tag claims. A stale copy would hand plugin users
          # a version this release never published.
          python3 - "$version" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          plugin = Path("plugins/free-search")
          manifest = json.loads((plugin / ".claude-plugin" / "plugin.json").read_text())
          if manifest["version"] != expected:
              raise SystemExit(f"plugin.json version {manifest['version']} != tag {expected}")
          servers = json.loads((plugin / ".mcp.json").read_text())["mcpServers"]
          pin = servers["search"]["args"]
          if pin != [f"free-search-mcp=={expected}"]:
              raise SystemExit(f"plugin .mcp.json runs {pin}, not free-search-mcp=={expected}")
          # The Agent Plugins v1 copy of the same plugin (hermes plugins install).
          portable = json.loads((plugin / "plugin.json").read_text())
          if portable["version"] != expected:
              raise SystemExit(f"plugin/plugin.json version {portable['version']} != tag {expected}")
          pin = json.loads((plugin / "mcp.json").read_text())["mcpServers"]["search"]["args"]
          if pin != [f"free-search-mcp=={expected}"]:
              raise SystemExit(f"plugin mcp.json runs {pin}, not free-search-mcp=={expected}")
          PY

          # Same argument for the two newer install paths. The MCP Registry
          # entry and the Claude Desktop bundle both republish this package, so
          # each repeats the number — and the registry can only be told the
          # truth once: an entry published with the wrong version cannot be
          # edited, only superseded. tests/test_plugin_manifest.py checks the
          # same files against pyproject.toml; this checks them against the tag.
          python3 - "$version" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          name = "io.github.sweetcornna/free-search-mcp"

          entry = json.loads(Path("server.json").read_text())
          if entry["name"] != name:
              raise SystemExit(f"server.json is named {entry['name']}, not {name}")
          if len(entry["description"]) > 100:
              raise SystemExit("server.json description exceeds the registry's 100 characters")
          claimed = [entry["version"], *(pkg.get("version") for pkg in entry["packages"])]
          if claimed != [expected, expected]:
              raise SystemExit(f"server.json versions {claimed} != tag {expected}, once each")

          # PyPI builds the package description from this README and freezes it
          # with the release; the registry looks there for proof of ownership.
          if f"<!-- mcp-name: {name} -->" not in Path("README.md").read_text():
              raise SystemExit("README.md has no mcp-name marker; the registry would reject us")

          manifest = json.loads(Path("mcpb/manifest.json").read_text())
          if manifest["version"] != expected:
              raise SystemExit(f"mcpb/manifest.json version {manifest['version']} != tag {expected}")
          bundle = tomllib.loads(Path("mcpb/pyproject.toml").read_text())["project"]
          if bundle["version"] != expected:
              raise SystemExit(f"mcpb/pyproject.toml version {bundle['version']} != tag {expected}")
          if bundle["dependencies"] != [f"free-search-mcp=={expected}"]:
              raise SystemExit(
                  f"the bundle installs {bundle['dependencies']}, not free-search-mcp=={expected}"
              )
          PY

          # checkout fetches tags as lightweight refs, so the local ref may
          # point straight at the commit even when the pushed tag is annotated.
          # Re-fetch the tag object itself before judging what kind it is.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "$TAG must be an annotated tag" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{}")" != "$GITHUB_SHA" ]]; then
            echo "$TAG does not resolve to the workflow commit" >&2
            exit 1
          fi
          # A tag-triggered checkout only guarantees the tagged ref, so main is
          # fetched explicitly rather than assumed present.
          git fetch --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "$TAG does not point into main history" >&2
            exit 1
          fi
          title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          if [[ -z "$title" ]]; then
            echo "$TAG has no annotation subject" >&2
            exit 1
          fi
          printf '%s\n' "$title" > release-title.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Its own step so that the packer — an npm tool fetched at run time —
      # never shares an environment with a token, and pinned for the reason the
      # SDK is: a release must not change because a tool did. `pack` validates
      # the manifest against the MCPB schema before it writes anything.
      - name: Build Claude Desktop bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb "bundle/free-search-mcp-$VERSION.mcpb"
          test -s "bundle/free-search-mcp-$VERSION.mcpb"

      - name: Prepare release artifacts
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          metadata_file="$(mktemp)"
          errors_file="$(mktemp)"
          expected=(
            "free_search_mcp-$VERSION-py3-none-any.whl"
            "free_search_mcp-$VERSION.tar.gz"
          )
          # A release asset, never a dist/ file: the PyPI action uploads
          # whatever it finds in dist/, and PyPI has no use for a zip of JSON.
          bundle="free-search-mcp-$VERSION.mcpb"
          release_assets=("${expected[@]}" "$bundle")
          validate_dist_artifacts() {
            local name
            local -a actual wanted
            # `uv build` drops its own .gitignore into the output directory;
            # only the distributions themselves are release artifacts.
            mapfile -t actual < <(
              find dist -mindepth 1 -maxdepth 1 ! -name '.*' -printf '%f\n' \
                | LC_ALL=C sort
            )
            mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
            if [[ "${#actual[@]}" -ne "${#wanted[@]}" ]] || \
              ! diff -u \
                <(printf '%s\n' "${wanted[@]}") \
                <(printf '%s\n' "${actual[@]}"); then
              echo "dist/ must contain exactly the wheel and sdist for version $VERSION" >&2
              exit 1
            fi
            for name in "${expected[@]}"; do
              if [[ ! -f "dist/$name" ]]; then
                echo "Expected dist/$name to be a regular file" >&2
                exit 1
              fi
            done
          }
          release_exists=false
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            > "$metadata_file" 2> "$errors_file"; then
            release_exists=true
            is_draft="$(jq -r .draft "$metadata_file")"
            mapfile -t asset_names < <(jq -r '.assets[].name' "$metadata_file")
            assets_complete=true
            if [[ "${#asset_names[@]}" -ne "${#release_assets[@]}" ]]; then
              assets_complete=false
            else
              for name in "${release_assets[@]}"; do
                if [[ ! " ${asset_names[*]} " =~ " $name " ]]; then
                  assets_complete=false
                fi
              done
            fi
            if [[ "$assets_complete" == "true" ]]; then
              gh release download "$TAG" --dir dist \
                --pattern "*.whl" --pattern "*.tar.gz"
              validate_dist_artifacts
              if [[ "$is_draft" == "true" ]]; then
                gh release edit "$TAG" \
                  --title "$(<release-title.txt)" \
                  --notes-file release-notes.md
                echo "state=draft" >> "$GITHUB_OUTPUT"
              else
                echo "state=published" >> "$GITHUB_OUTPUT"
              fi
            elif [[ "$is_draft" == "true" ]]; then
              gh release delete "$TAG" --yes
              release_exists=false
            else
              echo "Published release assets do not match version $VERSION" >&2
              exit 1
            fi
          elif ! jq -e '.status == "404" or .status == 404' "$metadata_file" >/dev/null; then
            cat "$errors_file" >&2
            exit 1
          fi

          if [[ "$release_exists" == "false" ]]; then
            uv build --out-dir dist
            validate_dist_artifacts
            artifacts=("dist/${expected[0]}" "dist/${expected[1]}" "bundle/$bundle")
            gh release create "$TAG" "${artifacts[@]}" \
              --verify-tag \
              --fail-on-no-commits \
              --draft \
              --latest=false \
              --title "$(<release-title.txt)" \
              --notes-file release-notes.md
            echo "state=draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing PyPI files
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # The simple index — not the JSON API — is what `skip-existing`
          # effectively consults, and it is updated as part of the upload
          # rather than by a separate indexer. The JSON API can still 404 for
          # minutes after a successful publish, which would silently turn this
          # gate into a no-op on exactly the rerun it exists to protect.
          index_file="$(mktemp)"
          http_status="$(curl --silent --show-error --retry 3 --location \
            --header 'Accept: application/vnd.pypi.simple.v1+json' \
            --output "$index_file" --write-out '%{http_code}' \
            "https://pypi.org/simple/free-search-mcp/")"
          if [[ "$http_status" != "200" ]]; then
            echo "PyPI simple index request failed with HTTP $http_status" >&2
            exit 1
          fi
          python3 - "$index_file" dist "$VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          index, dist, version = sys.argv[1], Path(sys.argv[2]), sys.argv[3]
          artifacts = {
              path.name: path
              for path in dist.iterdir()
              if path.is_file() and not path.name.startswith(".")
          }
          published = {
              entry["filename"]: entry["hashes"].get("sha256")
              for entry in json.loads(Path(index).read_text())["files"]
              if entry["filename"] in artifacts
          }
          if not published:
              raise SystemExit(0)  # nothing uploaded yet; publishing is a no-op
          for filename, expected in sorted(published.items()):
              if not expected:
                  raise SystemExit(f"PyPI publishes no sha256 for {filename}")
              digest = hashlib.sha256(artifacts[filename].read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f"PyPI file {filename} differs from GitHub asset")
          missing = sorted(set(artifacts) - set(published))
          if missing:
              print(f"partial upload detected; will publish: {', '.join(missing)}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          attestations: false

      - name: Publish GitHub Release
        if: steps.github_release.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          latest=true
          while IFS= read -r published_tag; do
            published_version="${published_tag#v}"
            if [[ "$published_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
              [[ "$(printf '%s\n%s\n' "$VERSION" "$published_version" | sort -V | tail -n 1)" != "$VERSION" ]]; then
              latest=false
              break
            fi
          done < <(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName')
          if [[ "$latest" == "true" ]]; then
            gh release edit "$TAG" --draft=false --latest --verify-tag
          else
            gh release edit "$TAG" --draft=false --latest=false --verify-tag
          fi

  # Last: list the release in the MCP Registry. A job of its own because it
  # needs the one permission nothing above should hold — an OIDC token proving
  # to the registry that this run belongs to github.com/sweetcornna — and needs
  # neither of theirs: no write access to the repository, no PyPI secret.
  # Everything before it is already public by now, so a failure here leaves a
  # complete release and a job that is safe to re-run.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVER_NAME: io.github.sweetcornna/free-search-mcp
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already listed
        id: listed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Registry versions are immutable, so a re-run must not publish twice.
          # 404 covers both "no such server" and "no such version".
          status="$(curl --silent --show-error --retry 3 --output /dev/null \
            --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME//\//%2F}/versions/$version")"
          case "$status" in
            200) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "registry lookup failed with HTTP $status" >&2; exit 1 ;;
          esac

      - name: Wait for PyPI to show the ownership marker
        if: steps.listed.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.listed.outputs.version }}
        run: |
          set -euo pipefail
          # The registry proves ownership by reading this release's description
          # from PyPI's JSON API, which can trail a successful upload by
          # minutes. Publishing before it catches up fails validation.
          for attempt in $(seq 1 30); do
            if curl --silent --fail --location --output pypi.json \
              "https://pypi.org/pypi/free-search-mcp/$VERSION/json"; then
              if python3 - pypi.json <<'PY'
          import json
          import os
          import sys

          description = json.load(open(sys.argv[1]))["info"]["description"] or ""
          sys.exit(0 if f"mcp-name: {os.environ['SERVER_NAME']}" in description else 1)
          PY
              then
                exit 0
              fi
            fi
            echo "attempt $attempt: PyPI does not show the marker yet"
            sleep 20
          done
          echo "PyPI never showed the mcp-name marker for $VERSION" >&2
          exit 1

      - name: Add the Claude Desktop bundle to the entry
        if: steps.listed.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.listed.outputs.version }}
        run: |
          set -euo pipefail
          # Hash the asset users will actually download. Packing it again here
          # would produce a different zip — archives carry timestamps — and a
          # registry entry whose checksum no client could ever match.
          bundle="free-search-mcp-$VERSION.mcpb"
          gh release download "$TAG" --dir bundle --pattern "$bundle"
          python3 - "bundle/$bundle" "$TAG" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          asset, tag = Path(sys.argv[1]), sys.argv[2]
          path = Path("server.json")
          entry = json.loads(path.read_text())
          entry["packages"].append(
              {
                  "registryType": "mcpb",
                  "identifier": (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                      f"/releases/download/{tag}/{asset.name}"
                  ),
                  "fileSha256": hashlib.sha256(asset.read_bytes()).hexdigest(),
                  "transport": {"type": "stdio"},
              }
          )
          path.write_text(json.dumps(entry, indent=2) + "\n")
          PY

      - name: Publish to the MCP Registry
        if: steps.listed.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
