name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MATURIN_VERSION: "1.16.0"
  MCPB_VERSION: "2.1.2"
  MCP_PUBLISHER_VERSION: "v1.8.1"

jobs:
  # Reuses ci.yml verbatim so the release gate and the PR gate are identical.
  test:
    uses: ./.github/workflows/ci.yml

  validate:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata and version sync
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got $TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          python3 - "$version" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          dist = "free-search-mcp"
          registry_name = f"io.github.sweetcornna/{dist}"

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          if cargo["workspace"]["package"]["version"] != expected:
              raise SystemExit(f"Cargo.toml workspace version != tag {expected}")

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if pyproject["project"]["version"] != expected:
              raise SystemExit(f"pyproject.toml version != tag {expected}")
          if pyproject.get("tool", {}).get("maturin", {}).get("bindings") != "bin":
              raise SystemExit("pyproject.toml [tool.maturin].bindings must be 'bin'")

          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## [{expected}] - "
          try:
              start = next(i for i, line in enumerate(lines) if line.startswith(prefix))
          except StopIteration:
              raise SystemExit(f"CHANGELOG.md has no {expected} release section") from None
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1 : end]).strip() + "\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")

          plugin = Path("plugins/free-search")
          for rel in (".claude-plugin/plugin.json", "plugin.json"):
              data = json.loads((plugin / rel).read_text(encoding="utf-8"))
              if data["version"] != expected:
                  raise SystemExit(f"{rel} version {data['version']} != tag {expected}")

          for rel in (".mcp.json", "mcp.json", "mcp_config.json"):
              servers = json.loads((plugin / rel).read_text(encoding="utf-8"))["mcpServers"]
              if list(servers) != ["search"]:
                  raise SystemExit(f"{rel} must declare only server key 'search'")
              pin = servers["search"]["args"]
              if pin != [f"{dist}=={expected}"]:
                  raise SystemExit(f"{rel} runs {pin}, not {dist}=={expected}")

          entry = json.loads(Path("server.json").read_text(encoding="utf-8"))
          if entry["name"] != registry_name:
              raise SystemExit(f"server.json name {entry['name']} != {registry_name}")
          if len(entry["description"]) > 100:
              raise SystemExit("server.json description exceeds 100 characters")
          claimed = [entry["version"], *(pkg.get("version") for pkg in entry["packages"])]
          if claimed != [expected, expected]:
              raise SystemExit(f"server.json versions {claimed} != [{expected}, {expected}]")

          if f"<!-- mcp-name: {registry_name} -->" not in Path("README.md").read_text(encoding="utf-8"):
              raise SystemExit("README.md missing mcp-name ownership marker")

          mcpb = json.loads(Path("mcpb/manifest.json").read_text(encoding="utf-8"))
          if mcpb["version"] != expected:
              raise SystemExit(f"mcpb/manifest.json version {mcpb['version']} != tag {expected}")
          if mcpb["server"]["type"] != "binary":
              raise SystemExit("mcpb/manifest.json server.type must be 'binary'")
          tools = sorted(t["name"] for t in mcpb["tools"])
          if tools != ["ask", "exec", "search"]:
              raise SystemExit(f"mcpb/manifest.json tools {tools} != ['ask', 'exec', 'search']")
          PY

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "$TAG must be an annotated tag" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG^{}")" != "$GITHUB_SHA" ]]; then
            echo "$TAG does not resolve to the workflow commit" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "$TAG does not point into main history" >&2
            exit 1
          fi
          title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          if [[ -z "$title" ]]; then
            echo "$TAG has no annotation subject" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels are linked against glibc 2.28 through zig so they get a
          # manylinux_2_28 tag. Built natively on an Ubuntu 24.04 runner they
          # need glibc 2.39 (or get a bare `linux_*` tag, which PyPI rejects).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: --zig --compatibility manylinux_2_28
            platform_slug: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin_args: --zig --compatibility manylinux_2_28
            platform_slug: linux-aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            maturin_args: ""
            platform_slug: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            maturin_args: ""
            platform_slug: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned maturin (with zig)
        run: uv tool install "maturin[zig]==${MATURIN_VERSION}"
      - name: Build binary wheel
        run: |
          set -euo pipefail
          mkdir -p dist
          maturin build --release --locked --target "${{ matrix.target }}" --out dist ${{ matrix.maturin_args }}
          ls -la dist
          # PyPI rejects bare `linux_*` platform tags; fail here, not at upload.
          if ls dist/*.whl | grep -E -- '-linux_[a-z0-9_]+\.whl$'; then
            echo "wheel has a non-manylinux platform tag" >&2
            exit 1
          fi
      - name: Smoke-test wheel
        run: |
          set -euo pipefail
          uvx --from dist/free_search_mcp-*.whl free-search-mcp --help >/dev/null
      - name: Standalone binary and MCPB bundle (binary taken from the wheel)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SLUG: ${{ matrix.platform_slug }}
        run: |
          set -euo pipefail
          mkdir -p bundles mcpb-stage/bin bin
          python3 - dist/free_search_mcp-*.whl bin/free-search-mcp <<'PY'
          import sys, zipfile
          wheel, out = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(wheel) as z:
              [name] = [n for n in z.namelist() if n.endswith(".data/scripts/free-search-mcp")]
              with open(out, "wb") as f:
                  f.write(z.read(name))
          PY
          chmod +x bin/free-search-mcp
          bin/free-search-mcp --version
          cp -R mcpb/* mcpb-stage/
          cp bin/free-search-mcp mcpb-stage/bin/free-search-mcp
          npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" pack mcpb-stage "bundles/free-search-mcp-${VERSION}-${SLUG}.mcpb"
          tar -czf "bundles/free-search-mcp-${VERSION}-${SLUG}.tar.gz" -C bin free-search-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform_slug }}
          path: |
            dist/*.whl
            bundles/*

  build-sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned maturin
        run: uv tool install "maturin==${MATURIN_VERSION}"
      - name: Build sdist
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    needs: [validate, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect PyPI and GitHub release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist release-assets
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts/dist-sdist -name '*.tar.gz' -exec cp {} dist/ \;
          cp dist/* release-assets/
          find artifacts -name '*.mcpb' -exec cp {} release-assets/ \;
          find artifacts -name 'free-search-mcp-*-darwin-*.tar.gz' -o -name 'free-search-mcp-*-linux-*.tar.gz' | xargs -r -I{} cp {} release-assets/
          ls -la dist release-assets

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ needs.validate.outputs.title }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --fail-on-no-commits \
            --draft \
            --latest=false \
            --title "$TITLE" \
            --notes-file artifacts/release-notes/release-notes.md

      - name: Publish wheels and sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          attestations: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          latest=true
          while IFS= read -r published_tag; do
            published_version="${published_tag#v}"
            if [[ "$published_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
              [[ "$(printf '%s\n%s\n' "$VERSION" "$published_version" | sort -V | tail -n 1)" != "$VERSION" ]]; then
              latest=false
              break
            fi
          done < <(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName')
          if [[ "$latest" == "true" ]]; then
            gh release edit "$TAG" --draft=false --latest --verify-tag
          else
            gh release edit "$TAG" --draft=false --latest=false --verify-tag
          fi

  registry:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVER_NAME: io.github.sweetcornna/free-search-mcp
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already listed
        id: listed
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 3 --output /dev/null \
            --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME//\//%2F}/versions/$VERSION")"
          case "$status" in
            200) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "registry lookup failed with HTTP $status" >&2; exit 1 ;;
          esac

      - name: Wait for PyPI to show the ownership marker
        if: steps.listed.outputs.skip == 'false'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --silent --fail --location --output pypi.json \
              "https://pypi.org/pypi/free-search-mcp/$VERSION/json"; then
              if python3 - pypi.json <<'PY'
          import json, os, sys
          description = json.load(open(sys.argv[1]))["info"]["description"] or ""
          sys.exit(0 if f"mcp-name: {os.environ['SERVER_NAME']}" in description else 1)
          PY
              then
                exit 0
              fi
            fi
            echo "attempt $attempt: PyPI does not show the marker yet"
            sleep 20
          done
          echo "PyPI never showed the mcp-name marker for $VERSION" >&2
          exit 1

      - name: Publish to the MCP Registry
        if: steps.listed.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
