name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml reuse this exact job set as its gate — releases can never
  # run on a weaker check than PRs.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace offline unit & replay tests
        run: cargo test --workspace --locked
      - name: Tri-client plugin manifest & version sync test
        run: cargo test -p fsm-server --test plugin_manifests --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
