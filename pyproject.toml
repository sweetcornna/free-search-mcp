[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "free-search-mcp"
version = "1.0.1"
description = "Local-first, no-API-key Rust search, ask, and sandboxed exec MCP server across 500+ web, academic, and specialist sources."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = [
    "mcp",
    "model-context-protocol",
    "web-search",
    "search",
    "academic-search",
    "scholar",
    "rust",
    "quickjs",
    "llm",
    "no-api-key",
    "claude-code-plugin",
    "codex-plugin",
    "antigravity-plugin",
    "agent-skills",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
Homepage = "https://github.com/sweetcornna/free-search-mcp"
Repository = "https://github.com/sweetcornna/free-search-mcp"
Issues = "https://github.com/sweetcornna/free-search-mcp/issues"
Changelog = "https://github.com/sweetcornna/free-search-mcp/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/server/Cargo.toml"
