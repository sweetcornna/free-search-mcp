[project]
name = "free-search-mcp"
version = "0.7.0"
description = "Local-first, no-API-key search MCP server. Multi-engine web search, smart fetching, document reading."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "web-search",
    "search",
    "scraping",
    "playwright",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # v2 is the floor, not a preference: it is the first release that speaks
    # protocol revision 2026-07-28, and it renamed `FastMCP` -> `MCPServer`
    # with no compatibility alias, so server.py cannot run on 1.x either.
    # One MCPServer instance serves both protocol eras, so this does not drop
    # older clients.
    "mcp[cli]>=2.0.0",
    # [socks] extra so the documented socks5:// proxy works with the httpx
    # clients in documents.py / structured.py (curl_cffi handles socks natively).
    "httpx[socks]>=0.27",
    "curl-cffi>=0.7",
    "selectolax>=0.3.21",
    "playwright>=1.47",
    "pypdf>=5.0",
    "python-docx>=1.1",
    # Office / ebook readers for read_doc. Each is pulled in lazily at parse
    # time, so an install that never opens a spreadsheet never imports openpyxl.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "ebooklib>=0.18",
    # Pillow reads image dimensions from the first few KB of a file, so `fetch`
    # can describe an image without decoding (or inlining) the whole thing.
    "pillow>=10.0",
    "markdownify>=0.13",
    "trafilatura>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "anyio>=4.4",
    "rapidfuzz>=3.10",
    "extruct>=0.18",
    # Imported directly (structured.py: w3lib.html.get_base_url), not just a
    # transitive dep of extruct — declare it so a future extruct can't break us.
    "w3lib>=2.0",
    # Imported directly by admin.py; today they arrive transitively via mcp[cli],
    # but the search-mcp-admin entry point must not depend on mcp's extras.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/sweetcornna/free-search-mcp"
Repository = "https://github.com/sweetcornna/free-search-mcp"
Issues = "https://github.com/sweetcornna/free-search-mcp/issues"
Changelog = "https://github.com/sweetcornna/free-search-mcp/blob/main/CHANGELOG.md"

[project.scripts]
search-mcp = "search_mcp.__main__:main"
# Alias matching the PyPI distribution name so a bare `uvx free-search-mcp`
# starts the server without needing --from.
free-search-mcp = "search_mcp.__main__:main"
search-mcp-admin = "search_mcp.admin:main"
search-mcp-login = "search_mcp.login:main"

[build-system]
# hatchling>=1.26 for PEP 639 license expression support.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_mcp"]

# Without an explicit include list hatchling sweeps the whole tree into the
# sdist — including untracked local dirs like freesearch-promo/node_modules.
[tool.hatch.build.targets.sdist]
include = [
    "src/search_mcp",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pytest.ini",
    "docker-compose.yml",
    "Dockerfile",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "C4", "RET"]
ignore = [
    # Long URLs / golden HTML fixtures make strict line-length noisy in tests.
    "SIM105",  # try/except/pass is often clearer than contextlib.suppress here
    "RET504",  # named return values document intent in the parsers
]

[tool.ruff.lint.per-file-ignores]
# E501: long URLs / golden HTML fixtures; B017: "raises anything" is the
# intended assertion for cache-miss resources.
"tests/*" = ["E501", "B017"]
# Long lines live inside embedded HTML/CSS/JS template strings where a noqa
# comment would leak into the rendered page.
"src/search_mcp/admin.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
