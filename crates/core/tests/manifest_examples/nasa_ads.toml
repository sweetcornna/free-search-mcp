id = "nasa_ads"
name = "NASA Astrophysics Data System (ADS)"
summary = "Astronomy, astrophysics, and physics literature index with citations."
aliases = ["adsabs", "astrophysics"]
home_url = "https://ui.adsabs.harvard.edu"
tier = 2
scopes = ["academic.physics"]
caps = ["search", "lookup", "graph"]
transport = "plain"
pool_role = "scope_only"
limits = { rps = 5.0, burst = 10, concurrency = 4, timeout_ms = 6000, cache_ttl_s = 43200 }

[auth]
mode = "required"
env = "SEARCH_MCP_ADS_API_KEY"
in = "header"
name = "Authorization"
format = "Bearer {key}"
route_requires_key = true

[op.search]
summary = "Search NASA ADS astronomy/physics records."
method = "GET"
url = "https://api.adsabs.harvard.edu/v1/search/query"
response = "json"
returns = "works"
const_query = { fl = "bibcode,title,author,year,pub,doi,citation_count,abstract" }
paginate = { style = "cursor", param = "cursorMark", max_pages = 3 }
probe = { params = { query = "exoplanet atmosphere", limit = 3 }, min_results = 2, fixture = "fixtures/academic_domain/nasa_ads/search/default.json" }

[op.search.params]
query = { type = "string", required = true, to = "q", doc = "ADS query" }
limit = { type = "int", default = 10, min = 1, max = 50, to = "rows", doc = "Rows" }
cursor = { type = "string", default = "*", to = "cursorMark", doc = "Cursor mark" }

[op.search.map]
items = ".response.docs[]"
next_cursor = ".nextCursorMark"
error = "if .error then (.error.msg // .error) else null end"
work = '''{
  title: (.title[0] // ""),
  authors: [(.author // [])[] | {name: .}],
  year: (.year | tonumber?),
  venue: .pub, workType: "article",
  ids: { doi: (.doi[0] // null | doi_norm) },
  abstractText: .abstract, citedBy: .citation_count, citedBySource: "nasa_ads",
  retracted: false, versions: [],
  url: ("https://ui.adsabs.harvard.edu/abs/" + .bibcode),
  sources: ["nasa_ads"]
}'''
