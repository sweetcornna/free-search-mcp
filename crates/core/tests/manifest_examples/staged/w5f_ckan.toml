# W0a test vector: copy of crates/manifests/staging/w5f/ckan.toml (2026-11-25), verbatim.
protocol = "ckan"

[[instance]]
id = "open_canada"
name = "Open Government Canada"
summary = "Canadian federal open data catalog indexing national climate, census, health, transportation, and geospatial datasets."
aliases = ["canada open data", "open.canada.ca"]
base_url = "https://open.canada.ca/data"
scopes = ["dataset", "gov"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "climate", limit = 3 }, min_results = 1 }

[[instance]]
id = "hdx_ocha"
name = "Humanitarian Data Exchange (UN OCHA)"
summary = "United Nations OCHA global humanitarian open data platform covering crises, epidemiology, displacement, food security, and boundaries."
aliases = ["hdx", "humdata", "un ocha"]
base_url = "https://data.humdata.org"
scopes = ["dataset", "gov"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "malaria", limit = 2 }, min_results = 1 }

