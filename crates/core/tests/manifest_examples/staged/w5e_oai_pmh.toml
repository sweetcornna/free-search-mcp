# W0a test vector: copy of crates/manifests/staging/w5e/oai_pmh.toml (2026-11-25), verbatim.
protocol = "oai_pmh"

[[instance]]
id = "doab_oai"
name = "DOAB (Directory of Open Access Books)"
summary = "Global OAI-PMH harvester of 85k+ peer-reviewed open-access academic books and monographs."
aliases = ["doab", "directory of open access books", "oa books"]
base_url = "https://directory.doabooks.org/oai/request"
scopes = ["academic", "academic.books", "academic.openaccess"]
caps = ["lookup", "harvest", "book"]
tier = 1
probe = { op = "identify", params = {}, min_results = 1 }

[[instance]]
id = "irdb_japan"
name = "IRDB (Institutional Repositories DataBase, Japan)"
summary = "NII national OAI-PMH harvester aggregating 5M+ papers, kiyo bulletins, and theses from ~800 Japanese universities."
aliases = ["irdb", "nii irdb", "japan institutional repositories", "jpcoar"]
base_url = "https://irdb.nii.ac.jp/oai"
scopes = ["academic", "academic.openaccess", "academic.theses"]
caps = ["lookup", "harvest", "thesis"]
tier = 1
probe = { op = "identify", params = {}, min_results = 1 }

[[instance]]
id = "kci_korea"
