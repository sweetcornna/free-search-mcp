summary = "National Research Foundation of Korea OAI-PMH repository indexing ~2M+ accredited Korean scholarly journal articles."
aliases = ["kci", "korea citation index", "nrf korea"]
base_url = "https://www.kci.go.kr/kciportal/oai/request"
scopes = ["academic", "academic.index"]
caps = ["lookup", "harvest"]
tier = 1
probe = { op = "identify", params = {}, min_results = 1 }

