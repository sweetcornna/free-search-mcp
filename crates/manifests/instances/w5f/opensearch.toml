protocol = "opensearch"

[[instance]]
id = "nasa_cmr"
name = "NASA Earthdata CMR Collections"
summary = "NASA Common Metadata Repository OpenSearch catalog of global satellite, climate, atmospheric, and Earth observation dataset collections."
aliases = ["cmr", "earthdata", "nasa earthdata", "space", "satellite"]
base_url = "https://cmr.earthdata.nasa.gov/opensearch/collections/descriptor_document.xml"
scopes = ["dataset", "academic", "reference.geo"]
caps = ["search", "dataset"]
tier = 1
probe = { op = "search", params = { query = "modis", limit = 3 }, min_results = 1 }

[[instance]]
id = "cinii_research"
name = "CiNii Research (NII Japan)"
summary = "Japan National Institute of Informatics scholarly meta-index covering academic articles, books, doctoral dissertations, and research datasets."
aliases = ["cinii", "cir.nii.ac.jp", "nii japan"]
base_url = "https://cir.nii.ac.jp/opensearch/description.xml"
scopes = ["academic", "academic.theses", "academic.books", "dataset"]
caps = ["search", "book", "thesis", "dataset"]
tier = 1
limits = { rps = 1.0, burst = 2, concurrency = 2, timeout_ms = 10000, cache_ttl_s = 21600, host_bucket = "cir.nii.ac.jp" }
probe = { op = "search", params = { query = "transformer", limit = 3 }, min_results = 1 }

[[instance]]
id = "cinii_kaken"
name = "CiNii Research KAKEN Projects (JSPS Grants)"
summary = "Japan JSPS Grants-in-Aid for Scientific Research (KAKEN) funded projects and research reports indexed via NII CiNii OpenSearch."
