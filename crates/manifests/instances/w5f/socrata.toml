protocol = "socrata"

[[instance]]
id = "socrata_global"
name = "Socrata Global Open Data Discovery"
summary = "Cross-portal Discovery catalog indexing public datasets across hundreds of Socrata municipal, state, and federal portals."
aliases = ["socrata", "socrata discovery", "tyler open data"]
base_url = "https://api.us.socrata.com"
scopes = ["dataset", "gov"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "health", limit = 3 }, min_results = 1 }

[[instance]]
id = "cdc_open_data"
name = "US CDC Public Health Open Data"
summary = "Centers for Disease Control and Prevention public health surveillance, epidemiology, vaccination, and mortality datasets."
aliases = ["cdc", "cdc data", "data.cdc.gov"]
base_url = "https://data.cdc.gov"
scopes = ["dataset", "gov", "academic.biomed"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "influenza", limit = 3, domains = "data.cdc.gov" }, min_results = 1 }

