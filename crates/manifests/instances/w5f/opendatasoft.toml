protocol = "opendatasoft"

[[instance]]
id = "ods_public"
name = "OpenDataSoft Public Data Hub"
summary = "Curated global public dataset catalog hosted by OpenDataSoft spanning demographics, geospatial boundaries, climate, and mobility."
aliases = ["opendatasoft", "ods", "public.opendatasoft.com"]
base_url = "https://public.opendatasoft.com"
scopes = ["dataset", "reference"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "population", limit = 2 }, min_results = 1 }

[[instance]]
id = "france_economie"
name = "French Ministry of Economy & Finance Open Data"
summary = "Official French macroeconomic, fiscal, public procurement, business registry, and consumer price open datasets."
aliases = ["bercy", "data.economie.gouv.fr", "dgfip"]
base_url = "https://data.economie.gouv.fr"
scopes = ["dataset", "gov", "finance"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "energie", limit = 3 }, min_results = 1 }

