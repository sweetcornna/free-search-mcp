protocol = "dataverse"

[[instance]]
id = "borealis_ca"
name = "Borealis (Canadian Dataverse)"
summary = "Canadian national multidisciplinary research data repository shared across 70+ Canadian universities and research institutions."
aliases = ["borealis", "canadian dataverse", "scholars portal dataverse"]
base_url = "https://borealisdata.ca"
scopes = ["dataset", "academic"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "climate", limit = 3 }, min_results = 2 }

