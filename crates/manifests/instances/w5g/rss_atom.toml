protocol = "rss_atom"

[[instance]]
id = "nber_papers_rss"
name = "NBER New Working Papers Feed"
summary = "Weekly RSS feed of newly released National Bureau of Economic Research working papers."
aliases = ["nber rss", "nber working papers"]
base_url = "https://back.nber.org/rss/new.xml"
scopes = ["academic.preprint", "finance"]
caps = ["search", "harvest"]
tier = 1
probe = { op = "search", params = { limit = 5 }, min_results = 2 }

