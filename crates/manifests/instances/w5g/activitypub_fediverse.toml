protocol = "activitypub_fediverse"

[[instance]]
id = "lemmy_world"
name = "Lemmy.world"
summary = "Largest federated Lemmy link-aggregator and discussion server with keyless full-text post search."
aliases = ["lemmy.world", "lemmy"]
base_url = "https://lemmy.world"
scopes = ["forum"]
caps = ["search"]
tier = 1
dialect = { flavor = "lemmy" }
probe = { op = "search", params = { query = "rust", limit = 3 }, min_results = 2 }

