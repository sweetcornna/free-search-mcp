protocol = "sitemap_llms"

[[instance]]
id = "owasp_cheatsheets"
name = "OWASP Cheat Sheet Series (Sitemap)"
summary = "Canonical application security cheat sheets index covering authentication, cryptography, XSS, and SSRF defenses."
aliases = ["owasp cheatsheets", "cheatsheetseries.owasp.org"]
base_url = "https://cheatsheetseries.owasp.org/sitemap.xml"
scopes = ["security", "docs"]
caps = ["search", "harvest"]
tier = 1
probe = { op = "search", params = { query = "authentication", limit = 5 }, min_results = 2 }

