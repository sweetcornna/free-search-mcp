protocol = "mediawiki"

[[instance]]
id = "wiktionary"
name = "Wiktionary (English)"
summary = "Multilingual lexical dictionary with definitions, etymology, IPA pronunciation, and translations."
aliases = ["wiktionary.org", "en.wiktionary", "etymology wiki"]
base_url = "https://en.wiktionary.org/w/api.php"
scopes = ["reference"]
caps = ["search", "lookup"]
tier = 1
limits = { rps = 2.0, burst = 5, concurrency = 2, timeout_ms = 8000, cache_ttl_s = 21600, host_bucket = "wikimedia.org" }
probe = { op = "search", params = { query = "algorithm", limit = 3 }, min_results = 2 }

