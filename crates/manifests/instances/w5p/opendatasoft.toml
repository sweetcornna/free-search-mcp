protocol = "opendatasoft"

[[instance]]
id = "paris_open_data"
name = "Open Data Paris"
summary = "City of Paris official municipal open data catalog covering cycling counts, transit, cultural venues, environment, and urban planning."
aliases = ["paris data", "opendata.paris.fr"]
base_url = "https://opendata.paris.fr"
scopes = ["dataset", "gov", "reference.geo"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "velo", limit = 3 }, min_results = 1 }

