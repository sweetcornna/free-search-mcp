protocol = "ckan"

[[instance]]
id = "data_nsw_au"
name = "Data.NSW (New South Wales Open Data)"
summary = "Australian state of New South Wales open government data catalog covering transport, environment, planning, and public services."
aliases = ["nsw open data", "data.nsw.gov.au", "new south wales data"]
base_url = "https://data.nsw.gov.au/data"
scopes = ["dataset", "gov"]
caps = ["search", "lookup", "dataset"]
tier = 1
probe = { op = "search", params = { query = "transport", limit = 3 }, min_results = 1 }

