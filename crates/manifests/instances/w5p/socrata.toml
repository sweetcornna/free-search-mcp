protocol = "socrata"

[[instance]]
id = "la_city_data"
name = "Los Angeles Open Data (City of LA)"
summary = "City of Los Angeles municipal open data portal covering public safety, mobility, housing, permitting, and city finance."
aliases = ["los angeles data", "lacity data", "data.lacity.org"]
base_url = "https://data.lacity.org"
scopes = ["dataset", "gov"]
caps = ["search", "lookup", "dataset"]
tier = 1
default_params = { domains = "data.lacity.org" }
probe = { op = "search", params = { query = "crime", limit = 3, domains = "data.lacity.org" }, min_results = 1 }

