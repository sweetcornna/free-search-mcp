id = "catalogue_of_life"
name = "Catalogue of Life (ChecklistBank)"
summary = "Authoritative global taxonomic checklist of living and extinct species with scientific names, synonyms, vernacular names, and hierarchy."
aliases = ["col", "checklistbank", "species taxonomy", "catalogue of life"]
home_url = "https://www.catalogueoflife.org"
tier = 1
scopes = ["dataset", "academic.biomed"]
caps = ["search", "lookup", "dataset"]
transport = "plain"
pool_role = "scope_only"
limits = { rps = 5.0, burst = 10, concurrency = 4, timeout_ms = 8000, cache_ttl_s = 86400, host_bucket = "api.checklistbank.org" }

[op.search]
summary = "Search the latest Catalogue of Life release (dataset 3LR) by scientific or vernacular name."
method = "GET"
url = "https://api.checklistbank.org/dataset/3LR/nameusage/search"
headers = { Accept = "application/json" }
response = "json"
returns = "records"
paginate = { style = "offset", param = "offset", start = 0, max_pages = 3 }
probe = { params = { query = "Panthera tigris", limit = 3 }, min_results = 2, fixture = "fixtures/w5j/catalogue_of_life/search/default.json" }
examples = ["source.call('catalogue_of_life.search', { query: 'Panthera tigris', limit: 5 })"]

[op.search.params]
query = { type = "string", required = true, to = "q", doc = "Scientific or common species name (e.g. Panthera tigris)" }
rank = { type = "string", to = "rank", doc = "Optional taxonomic rank filter (e.g. species, genus, family)" }
limit = { type = "int", default = 10, min = 1, max = 50, to = "limit", doc = "Maximum matching name usages" }
offset = { type = "int", default = 0, min = 0, to = "offset", doc = "0-based offset" }

[op.search.map]
items = "(.result // [])[]"
total = ".total"
record = '''{
  id: (.id // .usage.id // ""),
  scientificName: (.usage.name.scientificName // .usage.label // ""),
  authorship: (.usage.name.authorship // null),
  rank: (.usage.name.rank // null),
  status: (.usage.status // null),
  group: (.group // null),
  vernacularNames: ([(.vernacularNames // [])[] | .name // empty] | unique | .[0:5]),
  lineage: [(.classification // [])[] | { rank: .rank, name: .name }],
  url: ("https://www.catalogueoflife.org/data/taxon/" + (.id // .usage.id // ""))
}'''
hit = '''{
  title: ((.usage.name.scientificName // .usage.label // "") + (if (.usage.name.authorship // "") != "" then (" " + .usage.name.authorship) else "" end)),
  url: ("https://www.catalogueoflife.org/data/taxon/" + (.id // .usage.id // "")),
  snippet: ([
    (if (.usage.name.rank // "") != "" then .usage.name.rank else empty end),
    (if (.usage.status // "") != "" then .usage.status else empty end),
    (if ((.vernacularNames // []) | length) > 0 then (([(.vernacularNames // [])[] | .name // empty] | unique | .[0:3]) | join(", ")) else empty end),
    (if ((.classification // []) | length) > 0 then ([(.classification[0:5])[] | .name] | join(" > ")) else empty end)
  ] | join(" · ")),
  date: null,
  dateSource: "api"
}'''

[op.taxon]
summary = "Fetch a single Catalogue of Life taxon record and nomenclatural details by taxon ID."
method = "GET"
url = "https://api.checklistbank.org/dataset/3LR/taxon/{id}"
headers = { Accept = "application/json" }
response = "json"
returns = "records"
probe = { params = { id = "4CGXS" }, min_results = 1, fixture = "fixtures/w5j/catalogue_of_life/taxon/default.json" }
examples = ["source.call('catalogue_of_life.taxon', { id: '4CGXS' })"]

[op.taxon.params]
id = { type = "string", required = true, in = "path", doc = "Catalogue of Life taxon ID (e.g. 4CGXS)" }

[op.taxon.map]
items = "."
record = '''{
  id: (.id // ""),
  scientificName: (.name.scientificName // ""),
  authorship: (.name.authorship // null),
  rank: (.name.rank // null),
  genus: (.name.genus // null),
  specificEpithet: (.name.specificEpithet // null),
  code: (.name.code // null),
  status: (.status // null),
  parentId: (.parentId // null),
  extinct: (.extinct // false),
  scrutinizer: (.scrutinizer // null),
  scrutinizerDate: (.scrutinizerDate | parse_date),
  sourceLink: (.link // null),
  url: ("https://www.catalogueoflife.org/data/taxon/" + (.id // ""))
}'''
