id = "wos_starter"
name = "Clarivate Web of Science Starter API"
summary = "Clarivate Web of Science Core Collection curated journal and proceedings metadata search (requires free Starter API key)."
aliases = ["wos", "web of science", "clarivate"]
home_url = "https://developer.clarivate.com/apis/wos-starter"
tier = 3
scopes = ["academic", "academic.index"]
caps = ["search", "lookup"]
transport = "plain"
pool_role = "scope_only"
limits = { rps = 1.0, burst = 2, concurrency = 2, timeout_ms = 10000, cache_ttl_s = 43200, host_bucket = "api.clarivate.com" }

[auth]
mode = "required"
env = "SEARCH_MCP_WOS_API_KEY"
in = "header"
name = "X-ApiKey"
format = "{key}"
route_requires_key = true

[op.search]
summary = "Search Web of Science Core Collection documents using WoS fielded queries (auto-wraps unfielded queries in TS=(...))."
method = "GET"
url = "https://api.clarivate.com/apis/wos-starter/v1/documents"
headers = { Accept = "application/json" }
response = "json"
returns = "works"
query_jaq = '''[
  ["q", (if ($p.query | test("^[A-Z]{2}=")) then $p.query else ("TS=(" + $p.query + ")") end)],
  ["db", ($p.db // "WOS")],
  ["limit", ($p.limit // 10)],
  ["page", ($p.page // 1)],
  ["sortField", ($p.sort // null)]
]'''
paginate = { style = "page", param = "page", start = 1, max_pages = 3 }
probe = { params = { query = "TI=transformer", limit = 3 }, min_results = 2, fixture = "fixtures/w5h/wos_starter/search/default.json" }

[op.search.params]
query = { type = "string", required = true, in = "none", doc = "WoS fielded query (e.g. TI=transformer, AU=Smith, DO=10.1038/...) or free-text auto-wrapped as TS=(...)" }
db = { type = "string", default = "WOS", enum = ["WOS", "BIOABS", "BCI", "BIOSIS", "CCC", "DIIDW", "DRCI", "MEDLINE", "PPRN", "SCIELO", "ZOOREC"], in = "none", doc = "WoS database edition" }
limit = { type = "int", default = 10, min = 1, max = 50, in = "none", doc = "Results per page" }
page = { type = "int", default = 1, min = 1, in = "none", doc = "1-based page number" }
sort = { type = "string", in = "none", doc = "Optional sort e.g. TC+D, PY+D, RS+D" }

[op.search.map]
items = "(.hits // [])[]"
total = ".metadata.total"
error = '''if (.error | type) == "object" then (.error.details // .error.message // (.error | tostring)) elif .error != null then (.error | tostring) elif (.message != null and .hits == null and .uid == null) then (.message | tostring) else null end'''
work = '''(
  (.links.record // (if .identifiers.doi then ("https://doi.org/" + .identifiers.doi) else ("https://www.webofscience.com/wos/woscc/full-record/" + (.uid // "")) end)) as $url |
  ((if (.citations | type) == "array" then ([.citations[] | .count | to_int | select(. != null)] | max) elif (.citations | type) == "object" then ((.citations.timesCited // .citations.count) | to_int) else null end) // null) as $cites |
  (if .source.publishYear != null and (.source.publishMonth // "") != "" then (((.source.publishYear | tostring) + " " + (.source.publishMonth | tostring)) | parse_date) else ((.source.publishedDate // null) | parse_date) end) as $pub_date |
  {
    title: (.title // "" | strip_tags),
    authors: [(.names.authors // [])[] | {
      name: (.displayName // .wosStandard // "" | collapse_ws),
      orcid: (.orcid // .identifiers.orcid // null)
    } | select(.name != "")],
    year: ((((.source.publishYear // .source.publishedDate // "") | tostring)[0:4]) | to_int),
    publishedDate: $pub_date,
    venue: (.source.sourceTitle // null | collapse_ws),
    workType: ((.types[0]? // "article") | ascii_downcase),
    ids: {
      doi: (.identifiers.doi // null | doi_norm),
      pmid: (.identifiers.pmid // null)
    },
    citedBy: $cites,
    citedBySource: (if $cites != null then "wos_starter" else null end),
    retracted: false,
    versions: [],
    url: $url,
    sources: ["wos_starter"]
  }
)'''

[op.work]
summary = "Fetch a single Web of Science document record by WoS UID."
method = "GET"
url = "https://api.clarivate.com/apis/wos-starter/v1/documents/{uid}"
headers = { Accept = "application/json" }
response = "json"
returns = "works"
probe = { params = { uid = "WOS:000469615300001" }, min_results = 1, fixture = "fixtures/w5h/wos_starter/work/default.json" }

[op.work.params]
uid = { type = "string", required = true, in = "path", encode = "raw", doc = "Web of Science accession number e.g. WOS:000469615300001" }

[op.work.map]
items = "."
error = "@ref:op.search.map.error"
work = "@ref:op.search.map.work"
