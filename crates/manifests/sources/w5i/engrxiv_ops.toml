id = "engrxiv_ops"
name = "engrXiv Engineering Preprints"
summary = "Independent open-access engineering preprint archive powered by PKP Open Preprint Systems (OPS) with search and OAI-PMH."
aliases = ["engrxiv", "engineering archive", "engrxiv.org"]
home_url = "https://engrxiv.org"
tier = 2
scopes = ["academic", "academic.preprint", "academic.openaccess"]
caps = ["search", "lookup", "harvest"]
transport = "plain"
pool_role = "scope_only"
limits = { rps = 1.0, burst = 3, concurrency = 2, timeout_ms = 10000, cache_ttl_s = 43200, host_bucket = "engrxiv.org" }

[op.search]
summary = "Search engrXiv engineering preprints via PKP OPS web search."
method = "GET"
url = "https://engrxiv.org/index.php/engrxiv/search/search"
headers = { Accept = "text/html" }
response = "html"
returns = "works"
paginate = { style = "page", param = "searchPage", start = 1, max_pages = 3 }
probe = { params = { query = "concrete" }, min_results = 2, fixture = "fixtures/w5i/engrxiv_ops/search/default.json" }
examples = ['source.call("engrxiv_ops.search", {query: "concrete"})']

[op.search.params]
query = { type = "string", required = true, to = "query", doc = "Engineering search keywords" }
page = { type = "int", min = 1, to = "searchPage", doc = "1-based result page" }
limit = { type = "int", default = 10, min = 1, max = 25, in = "none", doc = "Maximum matching preprints to return" }

[op.search.html]
items_css = "ul.search_results > li"
fields = { title = "h3.title a | text", url = "h3.title a | attr(href)", authors = ".meta .authors | text", details = ".meta .details | text" }
wall_markers = ["Access Denied", "Just a moment"]

[op.search.map]
items = '''[.[] | select((.title // "") != "")][0:($p.limit // 10)][]'''
work = '''(
  ((.details // "") | [try capture("Posted (?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})").d catch empty][0] | parse_date) as $dt |
  ((.url | resolve_url("https://engrxiv.org/")) // "https://engrxiv.org") as $url |
  {
    title: ((.title // "") | collapse_ws // ""),
    authors: [(.authors // "") | split(",")[] | collapse_ws | select(. != null and . != "") | {name: .}],
    year: (($dt // "")[0:4] | to_int),
    publishedDate: $dt,
    venue: "engrXiv",
    workType: "preprint",
    ids: {},
    oa: { status: "diamond", url: $url },
    retracted: false,
    versions: [],
    url: $url,
    sources: ["engrxiv_ops"]
  }
)'''
hit = '''(
  ((.details // "") | [try capture("Posted (?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})").d catch empty][0] | parse_date) as $dt |
  ((.url | resolve_url("https://engrxiv.org/")) // "https://engrxiv.org") as $url |
  {
    title: ((.title // "") | collapse_ws // ""),
    url: $url,
    snippet: ([((.authors // "") | collapse_ws), ((.details // "") | collapse_ws)] | map(select(. != null and . != "")) | join(" · ")),
    date: $dt,
    dateSource: (if $dt != null then "html" else null end)
  }
)'''

[op.work]
summary = "Fetch an engrXiv preprint record by numeric ID via OAI-PMH GetRecord."
method = "GET"
url = "https://engrxiv.org/index.php/engrxiv/oai"
headers = { Accept = "application/xml" }
response = "xml"
returns = "works"
const_query = { metadataPrefix = "oai_dc", verb = "GetRecord" }
probe = { params = { id = "1" }, min_results = 1, fixture = "fixtures/w5i/engrxiv_ops/work/default.json" }
examples = ['source.call("engrxiv_ops.work", {id: "1"})']

[op.work.params]
id = { type = "string", required = true, to = "identifier", template = "oai:ops.engrxiv.org:preprint/{id}", doc = "engrXiv numeric preprint ID (e.g. 1)" }

[op.work.map]
items = '''."oai-pmh".getrecord.record | arr | .[] | select(.header."@status" != "deleted" and .metadata.dc != null)'''
error = '''."oai-pmh".error | if . == null then null else (first_str // ."@code" // "OAI error") end'''
work = '''(
  .metadata.dc as $dc |
  (($dc.title | first_str | collapse_ws) // "") as $title |
  (($dc.description | first_str | collapse_ws) | if . == "" then null else . end) as $desc |
  ($dc.rights | first_str) as $lic |
  ($dc.date | first_str | parse_date) as $dt |
  ([($dc.identifier | arr)[] | xml_text]) as $ids |
  ([$ids[] | select(startswith("http"))][0] // "https://engrxiv.org") as $url |
  ([$ids[] | doi_norm | select(. != null)][0] // null) as $doi |
  ([($dc.relation | arr)[] | xml_text | select(contains("/preprint/view/")) | sub("/preprint/view/"; "/preprint/download/")][0] // null) as $pdfUrl |
  {
    title: $title,
    authors: [($dc.creator | arr)[] | first_str | collapse_ws | select(. != null and . != "") | {name: .}],
    year: (($dt // "")[0:4] | to_int),
    publishedDate: $dt,
    venue: "engrXiv",
    workType: "preprint",
    ids: { doi: $doi },
    abstractText: $desc,
    oa: { status: "diamond", url: $url, pdfUrl: $pdfUrl, license: $lic },
    retracted: false,
    versions: [],
    url: $url,
    sources: ["engrxiv_ops"]
  }
)'''

[op.list]
summary = "List engrXiv OAI-PMH preprint identifiers updated within an optional date range."
method = "GET"
url = "https://engrxiv.org/index.php/engrxiv/oai"
headers = { Accept = "application/xml" }
response = "xml"
returns = "records"
const_query = { verb = "ListIdentifiers" }
query_jaq = '''if ($p.cursor // "") != "" then [["resumptionToken", $p.cursor]] else ([["metadataPrefix", "oai_dc"]] + (if ($p.from // "") != "" then [["from", $p.from]] else [] end) + (if ($p.until // "") != "" then [["until", $p.until]] else [] end)) end'''
paginate = { style = "token", param = "cursor", max_pages = 3 }
probe = { params = { from = "2026-11-01" }, min_results = 2, fixture = "fixtures/w5i/engrxiv_ops/list/default.json" }
examples = ['source.call("engrxiv_ops.list", {from: "2026-11-01"})']

[op.list.params]
from = { type = "string", in = "none", doc = "Start date YYYY-MM-DD" }
until = { type = "string", in = "none", doc = "End date YYYY-MM-DD" }
cursor = { type = "string", in = "none", doc = "Exclusive OAI-PMH resumptionToken" }

[op.list.map]
items = '''."oai-pmh".listidentifiers.header | arr | .[] | select(."@status" != "deleted")'''
next_cursor = '''."oai-pmh".listidentifiers.resumptiontoken | first_str'''
error = '''."oai-pmh".error | if . == null then null else (first_str // ."@code" // "OAI error") end'''
record = '''{
  identifier: (.identifier | xml_text),
  datestamp: ((.datestamp | first_str | parse_date) // (.datestamp | xml_text)),
  sets: [(.setspec | arr)[] | first_str | select(. != null)]
}'''
